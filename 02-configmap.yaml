apiVersion: v1
kind: ConfigMap
metadata:
  name: bodega-config
  namespace: bodega-app
data:
  # ==========================================
  # CONFIGURACIÓN GENERAL Y PUERTOS
  # ==========================================
  PORT: "8085"
  PORT_BA: "8000"
  APP_ENV: "production"
  LOG_LEVEL: "INFO"

  # ==========================================
  # SQL SERVER
  # ==========================================
  SQL_SERVER_HOST: "database-1.cdf3hrurvewl.us-east-1.rds.amazonaws.com"
  SQL_SERVER_PORT: "1433"
  SQL_SERVER_DB: "BodegaPeiranoDBF"
  SQL_URL: "jdbc:sqlserver://database-1.cdf3hrurvewl.us-east-1.rds.amazonaws.com:1433;databaseName=BodegaPeiranoDBF;encrypt=true;trustServerCertificate=true"

  # ==========================================
  # MONGODB (Instancia EC2 dedicada en Subred Privada)
  # ==========================================
  MONGO_DATABASE: "BodegaPeiranoDB"
  DB_NAME: "BodegaPeiranoDB"
  MONGO_HOST: "10.0.143.79" # Reemplazar con la IP privada de la EC2 de Mongo (ej: 10.0.10.50)
  MONGO_PORT: "27017"
  MONGO_URI: "mongodb://admin:Mongo12345!@10.0.143.79:27017/BodegaPeiranoDB?authSource=admin"
  MONGO_TLS: "false"

  # ==========================================
  # FRONTEND CONFIG (DNS interno en K8s FQDN)
  # ==========================================
  VITE_API_URL: "http://backend-service.bodega-app.svc.cluster.local:8085"
  VITE_API_BA_URL: "http://backend-ba-service.bodega-app.svc.cluster.local:8000"

