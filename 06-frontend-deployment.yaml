apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: bodega-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      nodeSelector:
        node-role: frontend-worker
      containers:
      - name: react-nginx
        image: jazett/projectoreact-prueba:latest
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: bodega-config
